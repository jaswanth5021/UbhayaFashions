services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ChangeThisStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=LadiesDressStore;User Id=sa;Password=ChangeThisStrongPassword123!;TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "ChangeThisToALongRandomProductionSecretAtLeast32Chars"
      Jwt__Issuer: "LadiesDressStore"
      Jwt__Audience: "LadiesDressStoreWeb"
      FrontendUrl: "${FRONTEND_URL:-https://ubhaya1.duckdns.org}"
      UploadsPath: /data/uploads
    ports:
      - "5000:5000"
    volumes:
      - store-uploads:/data/uploads
    depends_on:
      - db

  web:
    build: ./frontend
    environment:
      ApiBaseUrl: "http://api:5000/"
      UploadsPath: /data/uploads
    ports:
      - "5173:80"
    volumes:
      - store-uploads:/data/uploads
    depends_on:
      - api

volumes:
  sql-data:
  store-uploads:
