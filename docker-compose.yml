services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD}"
    volumes:
      - sql-data:/var/opt/mssql
    restart: unless-stopped
  api:
    build: ./backend
    env_file: backend.production.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      PaymentTesting__Enabled: "false"
      UploadsPath: /data/uploads
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - store-uploads:/data/uploads
    depends_on:
      - db
    restart: unless-stopped
  web:
    build: ./frontend
    env_file: frontend.production.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ApiBaseUrl: http://api:5000/
      UploadsPath: /data/uploads
      DataProtection__KeysPath: /data/keys
      PaymentTesting__Enabled: "false"
    ports:
      - "127.0.0.1:5173:8080"
    volumes:
      - store-uploads:/data/uploads
      - storefront-keys:/data/keys
    depends_on:
      - api
    restart: unless-stopped
volumes:
  sql-data:
  store-uploads:
  storefront-keys:
