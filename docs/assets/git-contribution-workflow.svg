<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc"><title id="title">Git contribution workflow</title><desc id="desc">UBHAYA FASHIONS process diagram</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b34e91"/></marker><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#56334f" flood-opacity=".08"/></filter></defs><rect width="1500" height="500" rx="22" fill="#fbf8fc"/><text x="60" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#7d356d" text-anchor="start">Git contribution workflow</text><text x="60" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#756b79" text-anchor="start">A repeatable path from a clean branch to a reviewed merge</text><rect x="70" y="140" width="290" height="100" rx="15" fill="#fff2fa" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="215" y="171" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Update Base Branch</text><text x="215" y="192" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Start from latest master</text><circle cx="88" cy="157" r="11" fill="#f4ddec"/><text x="88" y="161" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">01</text><rect x="420" y="140" width="290" height="100" rx="15" fill="#f5f0ff" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="565" y="171" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Create Focused Branch</text><text x="565" y="192" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">One change per branch</text><circle cx="438" cy="157" r="11" fill="#f4ddec"/><text x="438" y="161" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">02</text><path d="M365 190 L413 190" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="770" y="140" width="290" height="100" rx="15" fill="#eff7ff" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="915" y="171" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Implement Change</text><text x="915" y="192" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Keep commits small</text><circle cx="788" cy="157" r="11" fill="#f4ddec"/><text x="788" y="161" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">03</text><path d="M715 190 L763 190" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1120" y="140" width="290" height="100" rx="15" fill="#eefaf4" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="1265" y="171" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Add Tests</text><text x="1265" y="192" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Cover behaviour</text><circle cx="1138" cy="157" r="11" fill="#f4ddec"/><text x="1138" y="161" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">04</text><path d="M1065 190 L1113 190" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="70" y="340" width="290" height="100" rx="15" fill="#fff8e9" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="215" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Build and Review</text><text x="215" y="392" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Inspect diff and secrets</text><circle cx="88" cy="357" r="11" fill="#f4ddec"/><text x="88" y="361" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">05</text><rect x="420" y="340" width="290" height="100" rx="15" fill="#fff2ed" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="565" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Pull Request</text><text x="565" y="392" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Describe evidence</text><circle cx="438" cy="357" r="11" fill="#f4ddec"/><text x="438" y="361" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">06</text><path d="M365 390 L413 390" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="770" y="340" width="290" height="100" rx="15" fill="#fff2fa" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="915" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Merge After Approval</text><text x="915" y="392" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Integrate safely</text><circle cx="788" cy="357" r="11" fill="#f4ddec"/><text x="788" y="361" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">07</text><path d="M715 390 L763 390" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M1330 240 C1330 240, 1330 325, 1330 325" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1330" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#7d356d" text-anchor="middle">Continue</text><path d="M420 440 L70 440" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><text x="245" y="430" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#7d356d" text-anchor="middle">Review / repeat</text></svg>