<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc"><title id="title">Security and trust boundaries</title><desc id="desc">UBHAYA FASHIONS process diagram</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b34e91"/></marker><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#56334f" flood-opacity=".08"/></filter></defs><rect width="1500" height="470" rx="22" fill="#fbf8fc"/><text x="60" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#7d356d" text-anchor="start">Security and trust boundaries</text><text x="60" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#756b79" text-anchor="start">The browser is untrusted; secrets and provider credentials stay on the server</text><rect x="55" y="190" width="180" height="105" rx="15" fill="#fff2fa" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="145" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Untrusted Browser</text><text x="145" y="242" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">No secrets stored here</text><circle cx="73" cy="207" r="11" fill="#f4ddec"/><text x="73" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">01</text><path d="M239 242 L256 242" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="260" y="190" width="180" height="105" rx="15" fill="#f5f0ff" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="350" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">HTTPS Website</text><text x="350" y="242" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Secure session &amp; CSRF</text><circle cx="278" cy="207" r="11" fill="#f4ddec"/><text x="278" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">02</text><path d="M444 242 L461 242" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="465" y="190" width="180" height="105" rx="15" fill="#eff7ff" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="555" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Backend API</text><text x="555" y="242" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Authentication &amp; authorization</text><circle cx="483" cy="207" r="11" fill="#f4ddec"/><text x="483" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">03</text><path d="M649 242 L666 242" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="670" y="190" width="180" height="105" rx="15" fill="#eefaf4" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="760" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">SQL Server</text><text x="760" y="242" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Private data boundary</text><circle cx="688" cy="207" r="11" fill="#f4ddec"/><text x="688" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">04</text><path d="M854 242 L871 242" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="875" y="190" width="180" height="105" rx="15" fill="#fff8e9" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="965" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Razorpay</text><text x="965" y="242" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Verified payment provider</text><circle cx="893" cy="207" r="11" fill="#f4ddec"/><text x="893" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">05</text><path d="M1059 242 L1076 242" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1080" y="190" width="180" height="105" rx="15" fill="#fff2ed" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="1170" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Delhivery</text><text x="1170" y="242" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Server-side token</text><circle cx="1098" cy="207" r="11" fill="#f4ddec"/><text x="1098" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">06</text><path d="M1264 242 L1281 242" fill="none" stroke="#b34e91" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1285" y="190" width="180" height="105" rx="15" fill="#fff2fa" stroke="#eadfeb" stroke-width="1.5" filter="url(#shadow)"/><text x="1375" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#302638">Email Provider</text><text x="1375" y="242" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#756b79">Server-side credentials</text><circle cx="1303" cy="207" r="11" fill="#f4ddec"/><text x="1303" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#7d356d">07</text><rect x="55" y="355" width="590" height="70" rx="14" fill="#fff2ed" stroke="#f4ded4"/><text x="78" y="383" font-family="Segoe UI,Arial" font-size="14" font-weight="800" fill="#7d356d">Never trust browser redirects as proof of payment.</text><text x="78" y="405" font-family="Segoe UI,Arial" font-size="12" fill="#756b79">Verify signatures and provider events on the backend.</text><rect x="675" y="355" width="750" height="70" rx="14" fill="#eefaf4" stroke="#d8f0e2"/><text x="698" y="383" font-family="Segoe UI,Arial" font-size="14" font-weight="800" fill="#7d356d">Protect data and credentials at every boundary.</text><text x="698" y="405" font-family="Segoe UI,Arial" font-size="12" fill="#756b79">Use least privilege, validation, secure configuration and audit logs.</text></svg>